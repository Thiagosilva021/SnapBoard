<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#080808">
    <title>Atividade | SnapBoard</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/perfil.css') }}">
    <style>
        .activity-page {
            max-width: 560px;
            margin: 0 auto;
            padding: 40px 20px 40px;
            min-height: calc(100vh - var(--navbar-height));
            display: flex;
            flex-direction: column;
        }
        .activity-page h1 {
            font-size: 22px;
            margin-bottom: 24px;
        }
        .activity-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--text-secondary);
            gap: 12px;
        }
        .activity-empty svg {
            width: 40px;
            height: 40px;
            opacity: .5;
        }
    </style>
</head>
<body>

<header class="navbar">
    <a href="{{ url_for('homepage') }}" class="logo">
        <img src="{{ url_for('static', filename='img/snapboard-logo.jpeg') }}" alt="SnapBoard">
        <span>SnapBoard</span>
    </a>
    <nav class="navigation">
        <a href="{{ url_for('homepage') }}" class="navigation-link">Início</a>
        <a href="{{ url_for('feed') }}" class="navigation-link">Explorar</a>
    </nav>
    <div class="navbar-actions">
        <button type="button" class="icon-button" data-theme-toggle aria-label="Alternar tema">
            <svg data-theme-icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"></svg>
        </button>
        <a href="{{ url_for('perfil', id_usuario=current_user.id) }}" class="profile-link" aria-label="Meu perfil">
            {% if current_user.foto_perfil %}
                <div class="profile-avatar"><img src="{{ url_for('static', filename='avatars/' ~ current_user.foto_perfil) }}" alt=""></div>
            {% else %}
                <div class="profile-avatar" aria-hidden="true">{{ current_user.username[0]|upper }}</div>
            {% endif %}
        </a>
    </div>
</header>

<main class="activity-page">
    <h1>Atividade</h1>

    <div class="activity-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78Z"></path>
        </svg>
        <p>Nenhuma atividade por aqui ainda.<br>Curtidas e novos seguidores vão aparecer nesta tela.</p>
    </div>
</main>

<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
{% include '_bottom_nav.html' %}
</body>
</html>
