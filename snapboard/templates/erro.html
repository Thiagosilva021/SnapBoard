<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080808">
    <title>{{ codigo }} — {{ titulo }} | SnapBoard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .error-code {
            font-size: clamp(56px, 12vw, 96px);
            font-weight: 800;
            letter-spacing: -.04em;
            color: var(--primary);
            line-height: 1;
            margin-bottom: 12px;
        }
        .error-title {
            font-size: 22px;
            margin-bottom: 10px;
        }
        .error-message {
            color: var(--text-secondary);
            max-width: 420px;
            margin: 0 auto 28px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <main class="error-page">
        <div>
            <div class="error-code">{{ codigo }}</div>
            <h1 class="error-title">{{ titulo }}</h1>
            <p class="error-message">{{ mensagem }}</p>

            {% if current_user.is_authenticated %}
                <a href="{{ url_for('feed') }}" class="primary-button">Voltar para o Explorar</a>
            {% else %}
                <a href="{{ url_for('homepage') }}" class="primary-button">Voltar para o início</a>
            {% endif %}
        </div>
    </main>

    {% include '_bottom_nav.html' %}
</body>
</html>
