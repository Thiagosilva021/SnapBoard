<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <meta name="theme-color"
          content="#080808">
    <title>Início | SnapBoard</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/home.css') }}">
</head>
<body>

<!-- =====================================================
     HEADER
====================================================== -->

<header class="navbar">

    <!-- LOGO -->

    <a href="{{ url_for('homepage') }}"
       class="brand">

        <img
            src="{{ url_for('static', filename='img/snapboard-logo.jpeg') }}"
            alt="SnapBoard"
            class="brand-logo"
        >

        <span class="brand-name">
            SnapBoard
        </span>

    </a>


    <!-- NAVEGAÇÃO -->

    <nav class="main-nav">

        <a href="{{ url_for('login') }}"
           class="nav-link">

            Faça login

        </a>

        <a href="{{ url_for('homepage') }}"
           class="nav-link active">

            Início

        </a>

        <a href="{{ url_for('feed') }}"
           class="nav-link">

            Explorar

        </a>

        <a href="{{ url_for('logout') }}"
           class="nav-link">

            Sair
        </a>

    </nav>


    <!-- PESQUISA -->

    <div class="search-container">

        <svg
            class="search-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
        >
            <circle cx="11" cy="11" r="7"></circle>

            <path d="m20 20-4-4"></path>

        </svg>


        <input
            type="search"
            class="search-input"
            placeholder="Pesquisar no SnapBoard..."
            aria-label="Pesquisar"
        >

    </div>


    <!-- AÇÕES -->

    <div class="navbar-actions">

        <!-- Tema -->

        <button
            class="icon-button"
            type="button"
            data-theme-toggle
            aria-label="Alternar tema"
        >

            <svg
                data-theme-icon
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
            >
            </svg>

        </button>


        <!-- Notificações -->

        <button
            class="icon-button notification-button"
            type="button"
            aria-label="Notificações"
        >

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
            >

                <path
                    d="M18 8a6 6 0 0 0-12 0
                       c0 7-3 7-3 9h18c0-2-3-2-3-9"
                ></path>

                <path
                    d="M10 21h4"
                ></path>

            </svg>

            <span class="notification-dot"></span>

        </button>


        <!-- Perfil -->

        <a
            href="{{ url_for('perfil', id_usuario=current_user.id) }}"
            class="profile-button"
        >

            <img
                src="{{ url_for('static', filename='img/default-avatar.png') }}"
                alt="Perfil"
            >

        </a>

    </div>

</header>



<!-- =====================================================
     CONTEÚDO PRINCIPAL
====================================================== -->

<main class="main-content">


    <!-- =================================================
         HERO
    ================================================== -->

    <section class="welcome-section">

        <div class="welcome-content">

            <span class="welcome-label">
                BEM-VINDO AO SNAPBOARD
            </span>


            <h1>
                Descubra ideias que
                <span>inspiram.</span>
            </h1>


            <p>
                Encontre referências, organize suas ideias
                e descubra conteúdos que combinam com você.
            </p>


            <div class="welcome-actions">

                <a
                    href="{{ url_for('feed') }}"
                    class="primary-button"
                >
                    Explorar agora
                </a>

            </div>

        </div>


        <!-- Elemento visual -->

        <div class="hero-decoration">

            <div class="decoration-card card-one">
                <div></div>
            </div>

            <div class="decoration-card card-two">
                <div></div>
            </div>

            <div class="decoration-card card-three">
                <div></div>
            </div>

        </div>

    </section>



<!-- =====================================================
     BOTÃO FLUTUANTE
====================================================== -->

<a
    href="{{ url_for('perfil', id_usuario=current_user.id) }}"
    class="floating-create"
>

 
    <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
    >

        <path d="M12 5v14"></path>
        <path d="M5 12h14"></path>

    </svg>

</a>

<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script src="{{ url_for('static', filename='js/home.js') }}"></script>
</body>
</html>
