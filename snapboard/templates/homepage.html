<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <meta name="theme-color"
          content="#080808">
    <title>Início | SnapBoard</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/home.css') }}">
</head>
<body>

<!-- =====================================================
     HEADER
====================================================== -->

<header class="navbar">

    <!-- LOGO -->

    <a href="{{ url_for('homepage') }}"
       class="logo">

        <img
            src="{{ url_for('static', filename='img/snapboard-logo.jpeg') }}"
            alt="SnapBoard"
        >

        <span>
            SnapBoard
        </span>

    </a>


    <!-- NAVEGAÇÃO -->

    <nav class="navigation">

        <a href="{{ url_for('homepage') }}"
           class="navigation-link active">

            Início

        </a>

        <a href="{{ url_for('feed') }}"
           class="navigation-link">

            Explorar

        </a>

    </nav>


    <!-- PESQUISA -->

    <div class="search">

        <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
        >
            <circle cx="11" cy="11" r="7"></circle>

            <path d="m20 20-4-4"></path>

        </svg>


        <input
            type="search"
            data-search-input
            data-search-target="{{ url_for('feed') }}"
            placeholder="Pesquisar no SnapBoard..."
            aria-label="Pesquisar por usuário"
        >

    </div>


    <!-- AÇÕES -->

    <div class="navbar-actions">

        <!-- Tema -->

        <button
            class="icon-button"
            type="button"
            data-theme-toggle
            aria-label="Alternar tema"
        >

            <svg
                data-theme-icon
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
            >
            </svg>

        </button>


        <!-- Notificações -->

        <button
            class="icon-button notification-button"
            type="button"
            aria-label="Notificações"
        >

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
            >

                <path
                    d="M18 8a6 6 0 0 0-12 0
                       c0 7-3 7-3 9h18c0-2-3-2-3-9"
                ></path>

                <path
                    d="M10 21h4"
                ></path>

            </svg>

            <span class="notification-dot"></span>

        </button>


        <!-- MENU MOBILE -->

        <button
            type="button"
            class="nav-toggle"
            data-nav-toggle
            aria-label="Abrir menu"
            aria-expanded="false"
            aria-controls="mobileNav"
        >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M4 6h16"></path>
                <path d="M4 12h16"></path>
                <path d="M4 18h16"></path>
            </svg>
        </button>


        <!-- Perfil -->

        <a
            href="{{ url_for('perfil', id_usuario=current_user.id) }}"
            class="profile-link"
            aria-label="Meu perfil"
        >

            <div class="profile-avatar" aria-hidden="true">{{ current_user.username[0]|upper }}</div>

        </a>

    </div>

</header>

<!-- MENU MOBILE -->
<nav class="mobile-nav-panel" id="mobileNav" data-mobile-nav aria-label="Navegação móvel">
    <a href="{{ url_for('homepage') }}">Início</a>
    <a href="{{ url_for('feed') }}">Explorar</a>
    <a href="{{ url_for('perfil', id_usuario=current_user.id) }}">Meu perfil</a>
    <a href="{{ url_for('logout') }}">Sair</a>
</nav>



<!-- =====================================================
     CONTEÚDO PRINCIPAL
====================================================== -->

<main class="main-content">


    <!-- =================================================
         HERO
    ================================================== -->

    <section class="welcome-section">

        <div class="welcome-content">

            <span class="welcome-label">
                BEM-VINDO AO SNAPBOARD
            </span>


            <h1>
                Descubra ideias que
                <span>inspiram.</span>
            </h1>


            <p>
                Encontre referências, organize suas ideias
                e descubra conteúdos que combinam com você.
            </p>


            <div class="welcome-actions">

                <a
                    href="{{ url_for('feed') }}"
                    class="primary-button"
                >
                    Explorar agora
                </a>

            </div>

        </div>


        <!-- Elemento visual -->

        <div class="hero-decoration">

            <div class="decoration-card card-one">
                <div></div>
            </div>

            <div class="decoration-card card-two">
                <div></div>
            </div>

            <div class="decoration-card card-three">
                <div></div>
            </div>

        </div>

    </section>



<!-- =====================================================
     BOTÃO FLUTUANTE
====================================================== -->

<a
    href="{{ url_for('perfil', id_usuario=current_user.id) }}#nova-postagem"
    class="floating-create"
    aria-label="Criar postagem"
>

    <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
    >

        <path d="M12 5v14"></path>
        <path d="M5 12h14"></path>

    </svg>

</a>

<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
<script src="{{ url_for('static', filename='js/search.js') }}"></script>
<script src="{{ url_for('static', filename='js/home.js') }}"></script>
</body>
</html>
